name: Probe Models
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: List models the endpoint serves
        env:
          GMI_API_KEY: ${{ secrets.GMI_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          r = requests.get("https://api.gmi-serving.com/v1/models",
                           headers={"Authorization": f"Bearer {os.environ['GMI_API_KEY']}"}, timeout=20)
          ids = sorted(m.get("id","") for m in r.json().get("data", []))
          print(f"HTTP {r.status_code} — {len(ids)} models:")
          for i in ids: print("  ", i)
          PY
