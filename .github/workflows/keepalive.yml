name: Keepalive

# Prevents GitHub from auto-disabling the scheduled "Morning Brief" workflow
# after 60 days of repository inactivity. Runs twice a month and pushes a tiny
# heartbeat commit so the repo always has recent activity.
#
# IMPORTANT: to reliably reset the inactivity timer, the push should use a
# Personal Access Token, not the built-in Actions token. Add a repo secret named
# KEEPALIVE_PAT (a fine-grained PAT scoped to this repo with Contents: read/write).
# Without it, this still runs but falls back to the default token.

on:
  schedule:
    - cron: "17 8 1,15 * *"   # 08:17 UTC on the 1st and 15th (max ~17-day gap)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.KEEPALIVE_PAT || github.token }}

      - name: Push heartbeat
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-active.txt
          git config user.name "morning-brief-bot"
          git config user.email "morning-brief-bot@users.noreply.github.com"
          git add .keepalive/last-active.txt
          git commit -m "chore: keepalive heartbeat [skip ci]" || { echo "nothing to commit"; exit 0; }
          git pull --rebase --autostash || true
          git push
