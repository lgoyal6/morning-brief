name: Morning Brief

on:
  schedule:
    # GitHub cron is UTC. All four fire daily so the brief lands ~morning Pacific
    # year-round (DST-safe). The first run to succeed claims the day's delivery
    # slot (a committed marker); later ones see it and skip in ~1min, so extra
    # crons are cheap and never double-send.
    #
    # NOTHING is scheduled on the hour: top-of-hour is GitHub's most congested
    # slot, and the old "0 15"/"0 16" crons paid for it every day — they started
    # 45-90min late (16:29 on 07-31, 16:45 on 08-04), and 08-04's 15:00 run was
    # dropped entirely. Off-hour minutes drift far less. Spacing is 30min so a
    # dropped primary is covered within half an hour instead of a full one.
    # These are now BACKSTOPS. The punctual trigger is a Cloudflare Worker cron
    # (see trigger/) that fires repository_dispatch at 07:55 Pacific — dispatched
    # runs start in ~15s, where these crons measured 45-90min late. They stay
    # because the Worker is another thing that can break, and the delivery marker
    # means whoever arrives second just skips.
    - cron: "50 14 * * *"  # 07:50 PDT / 06:50 PST
    - cron: "20 15 * * *"  # 08:20 PDT / 07:20 PST
    - cron: "50 15 * * *"  # 08:50 PDT / 07:50 PST
    - cron: "40 16 * * *"  # 09:40 PDT / 08:40 PST — final backstop

  # Fired by the Cloudflare Worker in trigger/. Treated exactly like a scheduled
  # run: it claims the day's slot and it sends.
  repository_dispatch:
    types: [morning-brief]
  workflow_dispatch:        # manual "Run workflow" button (always regenerates)
    inputs:
      send:
        description: "Also DM the brief to Discord (manual runs don't send by default)"
        type: boolean
        default: false

# Prevent overlapping runs from racing on the same git push.
concurrency:
  group: morning-brief
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the generated brief

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # Provide either GMI_API_KEY (recommended, open-weight model, ~free) or
      # OPENAI_API_KEY. The generator uses the first non-empty one.
      GMI_API_KEY: ${{ secrets.GMI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # LLM endpoint + model. Override with repo Variables if desired.
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.gmi-serving.com/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-ai/DeepSeek-V4-Flash' }}
      # Output cap, sized from measured runs — NOT a spend. You are billed for
      # tokens generated, so a bigger cap costs nothing extra; it only decides
      # when the model gets cut off. Lowering it does not save tokens, it
      # truncates the brief. Measured 2026-08-04: 17.0k and 25.3k completion
      # tokens for 66k/83k chars (~3.3 chars/token), so the worst real run sat at
      # 79% of a 32000 cap while briefs have grown 24k->66k chars in 12 days.
      # 40000 puts that worst case at 63% and still generates in ~5.5min at the
      # observed ~120 tok/s, well inside LLM_TIMEOUT.
      LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS || '40000' }}
      # If a completion still hits the cap, resume it from where it stopped rather
      # than shipping a clipped brief or regenerating from scratch.
      LLM_MAX_CONTINUATIONS: ${{ vars.LLM_MAX_CONTINUATIONS || '3' }}
      # How many ranked news items reach the prompt. 130 costs ~29k input tokens
      # per call — the dominant input cost, and it is re-paid by every retry and
      # every continuation. Lower this to cut spend.
      BRIEF_MAX_ITEMS: ${{ vars.BRIEF_MAX_ITEMS || '130' }}
      # Per-request wall clock. Must comfortably exceed one full generation at
      # LLM_MAX_TOKENS (~5.5min at 32000) — when this was 180s every request
      # timed out and the brief showed up two hours late. Raise it with, not
      # after, LLM_MAX_TOKENS.
      LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT || '600' }}
      # Reasoning models can burn the whole token budget on hidden thinking and
      # return an empty completion (200 OK, no content). Retries escalate
      # max_tokens toward the ceiling and step reasoning_effort down.
      LLM_MAX_RETRIES: ${{ vars.LLM_MAX_RETRIES || '3' }}
      LLM_MAX_TOKENS_CEILING: ${{ vars.LLM_MAX_TOKENS_CEILING || '32000' }}
      # Blank = let the endpoint choose on attempt 1. Pin to e.g. 'low' if empty
      # completions become chronic.
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
      # Live web search (optional). Add a SEARCH_API_KEY secret to enable; with
      # no key the brief falls back to RSS-only. Provider: tavily (default) or brave.
      SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'tavily' }}
      SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
      # Discord delivery. Manual runs only send when the `send` input is true;
      # scheduled runs always send. (Empty on non-dispatch events.)
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_TARGET: ${{ secrets.DISCORD_TARGET }}
      DISCORD_SEND: ${{ github.event.inputs.send }}
      # Misc
      ENABLE_QUOTES: "1"
      TZ: America/Los_Angeles

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # WeasyPrint (PDF renderer) needs the Pango/Cairo/GDK-Pixbuf system libs.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libcairo2 libgdk-pixbuf-2.0-0 libffi-dev fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate brief
        run: python scripts/generate_brief.py

      - name: Render PDF
        run: python scripts/render_pdf.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            briefs/*.md
            briefs/*.pdf
            briefs/*-sources.json

      - name: Commit generated brief
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "morning-brief-bot@users.noreply.github.com"
          git add briefs/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add morning brief for $(TZ=America/Los_Angeles date +%Y-%m-%d)"
          # A bare `|| true` here used to swallow a failed rebase, leaving a
          # detached HEAD mid-conflict -- then `git push` ran anyway and died
          # with "not currently on a branch". Abort cleanly and fail loudly.
          if ! git pull --rebase --autostash; then
            git rebase --abort || true
            echo "::error::Rebase conflict on briefs/ — another run already " \
                 "committed this date. Not pushing."
            exit 1
          fi
          git push

      - name: Send Discord PDF
        run: python scripts/send_discord.py

      # send_discord.py writes the delivery marker only after Discord confirms
      # the send, which is after the commit step above — so it needs its own
      # commit, or the next cron would never see it and would send again. This
      # step is skipped when the send fails, which is the point: the slot stays
      # unclaimed and the next cron gets to try.
      - name: Commit delivery marker
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "morning-brief-bot@users.noreply.github.com"
          git add briefs/.delivery.json
          if git diff --cached --quiet; then
            echo "No delivery marker change to commit."
            exit 0
          fi
          git commit -m "Record delivery of $(TZ=America/Los_Angeles date +%Y-%m-%d) brief"
          if ! git pull --rebase --autostash; then
            git rebase --abort || true
            echo "::error::Rebase conflict on the delivery marker — not pushing."
            exit 1
          fi
          git push
